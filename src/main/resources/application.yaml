spring:
  application:
    name: recommendation-service
  datasource:
    url: ${RECOMMENDATION_DB_URL:jdbc:postgresql://localhost:${RECOMMENDATION_DB_PORT:15433}/recommendation_db}
    username: ${RECOMMENDATION_DB_USER:recommendation_user}
    password: ${RECOMMENDATION_DB_PASSWORD:recommendation_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: ${RECOMMENDATION_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${RECOMMENDATION_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      ack-mode: manual_immediate
    consumer:
      group-id: ${RECOMMENDATION_KAFKA_CONSUMER_GROUP:recommendation-service}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${RECOMMENDATION_SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${RECOMMENDATION_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${RECOMMENDATION_SWAGGER_ENABLED:false}
    path: /swagger
    disable-swagger-default-url: true
    tryItOutEnabled: true

app:
  kafka:
    topics:
      podcast-content-events: ${RECOMMENDATION_KAFKA_TOPIC_PODCAST_CONTENT_EVENTS:podcast.content.events.v1}
  features:
    kafka-consumers-enabled: ${RECOMMENDATION_KAFKA_CONSUMERS_ENABLED:false}
    refresh-job-enabled: ${RECOMMENDATION_REFRESH_JOB_ENABLED:false}
    global-job-enabled: ${RECOMMENDATION_GLOBAL_JOB_ENABLED:false}
    cache-cleanup-enabled: ${RECOMMENDATION_CACHE_CLEANUP_ENABLED:false}
