services:
  app:
    build:
      context: ${RECOMMENDATION_BUILD_CONTEXT:-.}
    container_name: ${RECOMMENDATION_CONTAINER_NAME:-recommendation-service}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RECOMMENDATION_DB_URL: ${RECOMMENDATION_DB_URL:-jdbc:postgresql://postgres:5432/recommendation_db}
      RECOMMENDATION_DB_USER: ${RECOMMENDATION_DB_USER:-recommendation_user}
      RECOMMENDATION_DB_PASSWORD: ${RECOMMENDATION_DB_PASSWORD:-recommendation_pass}
      RECOMMENDATION_KAFKA_BOOTSTRAP_SERVERS: ${RECOMMENDATION_KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      RECOMMENDATION_KAFKA_CONSUMERS_ENABLED: ${RECOMMENDATION_KAFKA_CONSUMERS_ENABLED:-false}
      RECOMMENDATION_KAFKA_CONSUMER_GROUP: ${RECOMMENDATION_KAFKA_CONSUMER_GROUP:-recommendation-service}
      RECOMMENDATION_KAFKA_CONCURRENCY: ${RECOMMENDATION_KAFKA_CONCURRENCY:-1}
      RECOMMENDATION_KAFKA_MAX_POLL_RECORDS: ${RECOMMENDATION_KAFKA_MAX_POLL_RECORDS:-100}
      RECOMMENDATION_KAFKA_RETRY_ATTEMPTS: ${RECOMMENDATION_KAFKA_RETRY_ATTEMPTS:-5}
      RECOMMENDATION_KAFKA_RETRY_BACKOFF_MS: ${RECOMMENDATION_KAFKA_RETRY_BACKOFF_MS:-1000}
      RECOMMENDATION_KAFKA_DLT_ENABLED: ${RECOMMENDATION_KAFKA_DLT_ENABLED:-true}
      RECOMMENDATION_KAFKA_TOPIC_PODCAST_ACTIVITY_EVENTS: ${RECOMMENDATION_KAFKA_TOPIC_PODCAST_ACTIVITY_EVENTS:-podcast.activity.events.v1}
      RECOMMENDATION_KAFKA_TOPIC_PODCAST_CONTENT_EVENTS: ${RECOMMENDATION_KAFKA_TOPIC_PODCAST_CONTENT_EVENTS:-podcast.content.events.v1}
      RECOMMENDATION_KAFKA_TOPIC_PODCAST_SEARCH_EVENTS: ${RECOMMENDATION_KAFKA_TOPIC_PODCAST_SEARCH_EVENTS:-podcast.search.events.v1}
      RECOMMENDATION_KAFKA_DLT_TOPIC_PODCAST_ACTIVITY_EVENTS: ${RECOMMENDATION_KAFKA_DLT_TOPIC_PODCAST_ACTIVITY_EVENTS:-podcast.activity.events.v1.DLT}
      RECOMMENDATION_KAFKA_DLT_TOPIC_PODCAST_CONTENT_EVENTS: ${RECOMMENDATION_KAFKA_DLT_TOPIC_PODCAST_CONTENT_EVENTS:-podcast.content.events.v1.DLT}
      RECOMMENDATION_KAFKA_DLT_TOPIC_PODCAST_SEARCH_EVENTS: ${RECOMMENDATION_KAFKA_DLT_TOPIC_PODCAST_SEARCH_EVENTS:-podcast.search.events.v1.DLT}
      RECOMMENDATION_SECURITY_ENABLED: ${RECOMMENDATION_SECURITY_ENABLED:-true}
      RECOMMENDATION_JWT_SECRET: ${RECOMMENDATION_JWT_SECRET:-}
      RECOMMENDATION_JWT_ISSUER: ${RECOMMENDATION_JWT_ISSUER:-auth-service}
      RECOMMENDATION_PROMETHEUS_PUBLIC: ${RECOMMENDATION_PROMETHEUS_PUBLIC:-false}
      RECOMMENDATION_CORS_ALLOWED_ORIGINS: ${RECOMMENDATION_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8083}
      RECOMMENDATION_TRENDS_API_ENABLED: ${RECOMMENDATION_TRENDS_API_ENABLED:-true}
      RECOMMENDATION_PERSONAL_PODCASTS_API_ENABLED: ${RECOMMENDATION_PERSONAL_PODCASTS_API_ENABLED:-true}
      RECOMMENDATION_BLOCKS_API_ENABLED: ${RECOMMENDATION_BLOCKS_API_ENABLED:-true}
      RECOMMENDATION_REFRESH_JOB_ENABLED: ${RECOMMENDATION_REFRESH_JOB_ENABLED:-false}
      RECOMMENDATION_GLOBAL_JOB_ENABLED: ${RECOMMENDATION_GLOBAL_JOB_ENABLED:-false}
      RECOMMENDATION_CACHE_CLEANUP_ENABLED: ${RECOMMENDATION_CACHE_CLEANUP_ENABLED:-false}
      RECOMMENDATION_SWAGGER_ENABLED: ${RECOMMENDATION_SWAGGER_ENABLED:-false}
      RECOMMENDATION_PERSONAL_CACHE_TTL: ${RECOMMENDATION_PERSONAL_CACHE_TTL:-PT30M}
      RECOMMENDATION_GLOBAL_CACHE_TTL: ${RECOMMENDATION_GLOBAL_CACHE_TTL:-PT10M}
      RECOMMENDATION_REFRESH_USER_LIMIT: ${RECOMMENDATION_REFRESH_USER_LIMIT:-100}
      RECOMMENDATION_REFRESH_JOB_FIXED_DELAY_MS: ${RECOMMENDATION_REFRESH_JOB_FIXED_DELAY_MS:-1200000}
      RECOMMENDATION_GLOBAL_JOB_FIXED_DELAY_MS: ${RECOMMENDATION_GLOBAL_JOB_FIXED_DELAY_MS:-600000}
      RECOMMENDATION_CACHE_CLEANUP_FIXED_DELAY_MS: ${RECOMMENDATION_CACHE_CLEANUP_FIXED_DELAY_MS:-3600000}
    ports:
      - "${RECOMMENDATION_SERVER_PORT:-8083}:8083"

  postgres:
    image: ${RECOMMENDATION_POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: ${RECOMMENDATION_POSTGRES_CONTAINER_NAME:-recommendation-postgres}
    environment:
      POSTGRES_DB: ${RECOMMENDATION_DB_NAME:-recommendation_db}
      POSTGRES_USER: ${RECOMMENDATION_DB_USER:-recommendation_user}
      POSTGRES_PASSWORD: ${RECOMMENDATION_DB_PASSWORD:-recommendation_pass}
    ports:
      - "${RECOMMENDATION_DB_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RECOMMENDATION_DB_USER:-recommendation_user} -d ${RECOMMENDATION_DB_NAME:-recommendation_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
